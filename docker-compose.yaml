services:
  db:
    image: postgres:18.3-alpine3.23
    container_name: habbit_tracker_db
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=habbittracker
    ports:
      -"5499:5432"
    volumes:
      -habbit_tracker:"/var/lib/postgresql"

volumes:
  habbit_tracker:
    driver: local

